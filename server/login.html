<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar · Painel de anúncios</title>
  <link rel="icon" type="image/png" href="/favicon/favicon.png">
  <style>
    @font-face { font-family: 'Fraunces'; font-style: normal; font-weight: 300 500; font-display: swap; src: url(/assets/fonts/fraunces-normal-latin.woff2) format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 600; font-display: swap; src: url(/assets/fonts/inter-normal-latin.woff2) format('woff2'); }
    :root { --bg: #FBF8F4; --sand: #F4EDE6; --ink: #2B2420; --ink-2: #5F544D; --line: rgba(43,36,32,.14); --terra: #A24F31; --terra-h: #8E432A; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font: 16px/1.5 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    .card { width: 100%; max-width: 400px; background: #fff; border-radius: 24px; padding: 40px 32px; box-shadow: 0 30px 80px -40px rgba(43,36,32,.35); }
    img { height: 36px; width: auto; display: block; margin-bottom: 32px; }
    h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: 32px; letter-spacing: -.02em; line-height: 1.1; margin-bottom: 8px; }
    p.sub { color: var(--ink-2); margin-bottom: 28px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    input { width: 100%; height: 50px; border-radius: 12px; border: 1px solid var(--line); padding: 0 16px; font: inherit; margin-bottom: 18px; background: var(--bg); }
    input:focus { outline: 2px solid var(--terra); outline-offset: 1px; border-color: transparent; }
    button { width: 100%; height: 52px; border: 0; border-radius: 999px; background: var(--terra); color: #fff; font: 500 16px 'Inter', sans-serif; cursor: pointer; margin-top: 6px; }
    button:hover { background: var(--terra-h); }
    .erro { background: #FBE9E4; color: #8E2A12; border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 20px; display: none; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/assets/img/logo.webp" alt="Bianca Gonçalves" width="396" height="127">
    <h1>Painel de anúncios</h1>
    <p class="sub">Entre para acompanhar os resultados da sua campanha.</p>
    <div class="erro" id="erro" role="alert"></div>
    <form method="post" action="/painel/entrar">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </main>
  <script>
    var e = new URLSearchParams(location.search).get('erro');
    if (e) {
      var box = document.getElementById('erro');
      box.textContent = e === 'tentativas' ? 'Muitas tentativas. Aguarde 15 minutos e tente novamente.' : 'E-mail ou senha incorretos.';
      box.style.display = 'block';
    }
  </script>
</body>
</html>
